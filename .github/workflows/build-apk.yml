name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScrollReader.apk

      # A release gives a direct .apk download link (no zip).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" ScrollReader.apk \
            --title "Scroll Reader (build ${{ github.run_number }})" \
            --notes "Tap ScrollReader.apk below to download and install." \
            --latest

      # If the build breaks, post the error as an issue so it can be fixed.
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ github.run_number }} failed."
            echo
            echo '```'
            if [ -f build.log ]; then grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -80; echo "----- tail -----"; tail -60 build.log; fi
            echo '```'
          } > report.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file report.md
